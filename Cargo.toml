[package]
name = "ccl-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "host your own friday the 13th private server on ps4, one binary, no dependencies"
repository = "https://github.com"
authors = ["Camp Crystal Lake <hi@campcrystallake.xyz>"]

[dependencies]
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "ccl-server"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
