[package]
name = "ccl-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Friday the 13th private server backend"
repository = "https://github.com/khaled934533-source/f13-custom-backend"
authors = ["KLAY"]

[dependencies]
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

[[bin]]
name = "ccl-server"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
```
